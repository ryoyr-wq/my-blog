<script>
  document.addEventListener('DOMContentLoaded', function () {
    var input = document.getElementById('search-query');
    var command = document.getElementById('unix-search-command');
    var results = document.getElementById('search-results');
    var paths = {};
    var template = document.getElementById('search-file-paths');
    if (!input || !command || !results || !template) return;
    template.content.querySelectorAll('[data-permalink]').forEach(function (item) {
      paths[item.dataset.permalink] = item.dataset.path;
    });
    function updateCommand() {
      var query = input.value.trim();
      command.innerHTML = '<span>$</span> grep -ri ' + (query ? '&quot;' + query.replace(/[&<>]/g, '') + '&quot;' : '&lt;pattern&gt;') + ' ~/posts';
    }
    function addPaths() {
      results.querySelectorAll('a[href]').forEach(function (link) {
        var path = paths[link.getAttribute('href')];
        var content = link.querySelector('.grow');
        if (path && content && !content.querySelector('.search-result-path')) {
          var label = document.createElement('p');
          label.className = 'search-result-path';
          label.textContent = path;
          content.insertBefore(label, content.firstChild);
        }
      });
    }
    input.addEventListener('input', updateCommand);
    new MutationObserver(addPaths).observe(results, { childList: true });
    updateCommand();
  });
</script>
