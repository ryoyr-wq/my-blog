{{ define "main" }}
  <article class="lab-not-found">
    <div class="lab-not-found__content">
      <header class="lab-document-header">
        <p class="lab-document-label"><span></span> ERROR /</p>
        <h1>404</h1>
        <p class="lab-not-found__title">PAGE NOT FOUND</p>
        <p class="shell-error">bash: page: No such file or directory</p>
      </header>
      <div class="lab-not-found__body">
        <p>ページが見つかりませんでした．URLをご確認ください．</p>
        <a class="lab-not-found__link" href="{{ "" | relLangURL }}">ホームへ戻る <span aria-hidden="true">→</span></a>
      </div>
    </div>
    <div class="lab-not-found__visual" aria-hidden="true">
      <img src="{{ "missing-cubes.png" | relURL }}" alt="">
    </div>
  </article>
{{ end }}
